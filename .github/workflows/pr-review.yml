name: Terraform Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "*.tf"
      - "**/*.tf"

env:
  PYTHON_VERSION: "3.11"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: MaripeddiSupraj/ai-agents
          path: ai-agents
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.0.0

      - name: Install agent dependencies
        working-directory: ai-agents/terraform-review-agent
        run: pip install -r requirements.txt

      - name: Authenticate to GCP
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pass GCP project ID to Terraform
        if: ${{ secrets.GCP_PROJECT_ID != '' }}
        run: echo 'project_id = "${{ secrets.GCP_PROJECT_ID }}"' > terraform.tfvars

      - name: Run AI Terraform Review
        id: review
        working-directory: ai-agents/terraform-review-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          REDIS_URL: redis://localhost:6379/0
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: us-central1
          TERRAFORM_DIR: ${{ github.workspace }}
        run: |
          python -c "
import asyncio, os, sys
sys.path.insert(0, os.getcwd())
from app.models.state import make_initial_state
from app.workflows.graph import create_review_graph

async def main():
    initial = make_initial_state()
    initial['pr_number'] = ${{ github.event.pull_request.number }}
    initial['repository'] = '${{ github.repository }}'
    initial['changed_files'] = ${{ toJSON(github.event.pull_request.changed_files) }}
    graph = create_review_graph()
    result = await graph.ainvoke(dict(initial))
    print(f'Status: {result.get(\"status\")}')

asyncio.run(main())
"

      - name: Post review comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Review'));
            const body = '✅ **Terraform Review complete.**\n\nCheck the workflow run for detailed results.';
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, body,
              });
            }
