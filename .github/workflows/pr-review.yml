name: Terraform Review Agent
on: pull_request
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: MaripeddiSupraj/ai-agents/terraform-review-agent/action@v1
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
