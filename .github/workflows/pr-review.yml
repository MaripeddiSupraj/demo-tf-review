name: Terraform Review Agent
on:
  pull_request:
    paths: ["**.tf"]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: MaripeddiSupraj/ai-agents/terraform-review-agent/action@master
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          terraform_dir: ${{ github.workspace }}
        env:
          # AWS provider accepts any non-empty key at plan time (no real credentials needed)
          AWS_ACCESS_KEY_ID: demo
          AWS_SECRET_ACCESS_KEY: demo
          AWS_REGION: us-east-1
